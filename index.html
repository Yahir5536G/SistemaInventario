<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de inventario: administra productos por categoría.">
    <title>Productos | Sistema de Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="encabezado">
        <h1>Sistema de Inventario</h1>

        <nav aria-label="Menú principal">
            <ul class="menu">
                <li><a href="categorias.html">Categorías</a></li>
                <li><a href="index.html" class="activo" aria-current="page">Productos</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido" id="contenido">
        <section class="panel" aria-labelledby="tituloFormulario">
            <h2 id="tituloFormulario">Registrar producto</h2>

            <form id="formProducto">
                <input type="hidden" id="productoId">

                <div class="campo">
                    <label for="nombreProducto">
                        Nombre del producto
                    </label>
                    <input
                        type="text"
                        id="nombreProducto"
                        maxlength="100"
                        required
                        placeholder="Ej. Teclado">
                </div>

                <div class="campo">
                    <label for="descripcionProducto">
                        Descripción
                    </label>
                    <textarea
                        id="descripcionProducto"
                        rows="3"
                        maxlength="500"
                        placeholder="Descripción del producto"></textarea>
                </div>

                <div class="campo">
                    <label for="precioProducto">Precio</label>
                    <input
                        type="number"
                        id="precioProducto"
                        min="0"
                        max="9999999999.99"
                        step="0.01"
                        inputmode="decimal"
                        required>
                </div>

                <div class="campo">
                    <label for="cantidadProducto">Cantidad</label>
                    <input
                        type="number"
                        id="cantidadProducto"
                        min="0"
                        max="2147483647"
                        step="1"
                        inputmode="numeric"
                        required>
                </div>

                <div class="campo">
                    <label for="categoriaProducto">Categoría</label>
                    <select id="categoriaProducto" required>
                        <option value="">Selecciona una categoría</option>
                    </select>
                </div>

                <div class="acciones-formulario">
                    <button type="submit" class="boton">
                        Guardar producto
                    </button>

                    <button
                        type="button"
                        id="cancelarProducto"
                        class="boton boton-secundario">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="panel" aria-labelledby="tituloTabla">
            <h2 id="tituloTabla">Productos registrados</h2>

            <div class="tabla-contenedor">
                <table>
                    <caption class="solo-lector">
                        Lista de productos registrados
                    </caption>

                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Producto</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="listaProductos">
                        <tr>
                            <td colspan="7" class="sin-datos">
                                Cargando productos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="pie">
        <p>Sistema de Inventario | Proyecto CRUD con Supabase</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0"></script>
    <script src="js/comun.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
